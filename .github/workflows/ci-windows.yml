name: Windows Build (Subspace)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type (Debug/Release)'
        required: false
        type: string
        default: 'Release'

jobs:
  build_windows:
    runs-on: windows-2025
    steps:
    - run: git config --global core.autocrlf input
    - uses: actions/checkout@v5

    - uses: msys2/setup-msys2@v2
      with:
        update: true
        cache: true
        install: >-
          git base-devel make unzip
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          libusb:p
          boost:p
          fftw:p
          qt6-base:p
          qt6-multimedia:p
          qt6-serialport:p
          qt6-tools:p

    # Build 135: dropped jurplel/install-qt-action — aqt's metadata
    # consistently lagged Qt's new per-toolchain Updates.xml layout for
    # 6.11.x, and aqt 3.3/3.4 didn't recognize the qt6_6110_mingw
    # subdirectory structure. MSYS2's qt6-* packages track upstream
    # within days of release, build with the same MinGW GCC 15 we use
    # everywhere else (no ABI cross-toolchain surprises), and arrive
    # via the same package manager already in this workflow. Qt headers,
    # libs, plugins, and windeployqt all live under MSYSTEM_PREFIX
    # (/mingw64 on this runner).

    - name: Download Hamlib
      uses: robinraju/release-downloader@v1.12
      with:
        repository: 'hamlib/hamlib'
        fileName: 'hamlib-w64-4.6.5.zip'
        tag: '4.6.5'
        extract: true
        out-file-path: 'local/hamlib-tmp'

    - name: Setup Hamlib
      shell: msys2 {0}
      run: |
        mv local/hamlib-tmp/hamlib-w64-4.6.5 local/hamlib
        mv local/hamlib/lib/gcc/libhamlib.dll.a local/hamlib/lib/libhamlib.dll.a

    - name: Configure
      shell: msys2 {0}
      run: |
        cmake -B build \
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/local/hamlib;${MSYSTEM_PREFIX}" \
          -DCMAKE_BUILD_TYPE=${{ inputs.build-type || 'Release' }} \
          -DFFTW3F_LIBRARY=/mingw64/lib/libfftw3f.a

    - name: Build
      shell: msys2 {0}
      run: cmake --build build -j$(nproc)

    - name: Save Debug Symbols
      shell: msys2 {0}
      run: |
        # Save unstripped binary with DWARF debug info for crash analysis.
        # Use objcopy to extract debug symbols, then strip the release binary.
        cp build/JS8Call.exe build/JS8Call-debug.exe
        strip build/JS8Call.exe

    - name: Package
      shell: msys2 {0}
      run: |
        cp build/JS8Call.exe build/JS8Call/
        cp build/JS8Call/LICENSE build/JS8Call/ 2>/dev/null || true
        cp local/hamlib/bin/libhamlib-4.dll build/JS8Call/
        cp local/hamlib/bin/libusb-1.0.dll build/JS8Call/

        # Build 136: recursively bundle all MSYS2 runtime DLL dependencies.
        # MSYS2's Qt6 packages dynamically link to /mingw64/bin runtime
        # libraries (libzstd, libb2, libicu, libharfbuzz, etc.) that
        # windeployqt does not copy. Walk the PE import tables of the
        # JS8Call.exe AND every Qt plugin bundled by windeployqt, copy
        # any /mingw64/bin DLL they reference, recurse on those DLLs.
        copy_deps() {
            local pe="$1"
            local target_dir="$2"
            objdump -p "$pe" 2>/dev/null | awk '/DLL Name:/{print $3}' | while read dll; do
                local src="/mingw64/bin/$dll"
                local dst="$target_dir/$dll"
                if [ -f "$src" ] && [ ! -f "$dst" ]; then
                    cp "$src" "$dst"
                    copy_deps "$src" "$target_dir"
                fi
            done
        }
        copy_deps build/JS8Call/JS8Call.exe build/JS8Call/
        # Plugins copied by windeployqt have their own dependencies too
        for plugin in build/JS8Call/platforms/*.dll \
                      build/JS8Call/imageformats/*.dll \
                      build/JS8Call/multimedia/*.dll \
                      build/JS8Call/styles/*.dll \
                      build/JS8Call/tls/*.dll \
                      build/JS8Call/iconengines/*.dll \
                      build/JS8Call/networkinformation/*.dll; do
            [ -f "$plugin" ] && copy_deps "$plugin" build/JS8Call/
        done
        echo "=== Bundled DLLs ==="
        ls build/JS8Call/*.dll | wc -l
        ls build/JS8Call/*.dll

    - name: Extract Version
      id: version
      shell: msys2 {0}
      run: |
        ver=$(grep WSJTX_VERSION_PATCH Versions.cmake | grep -oP '[0-9]+\.[0-9]+')
        echo "APP_VERSION=4.0.${ver}" >> $GITHUB_OUTPUT

    - name: Create Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ steps.version.outputs.APP_VERSION }}" installer\js8call-subspace.iss
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: "JS8Call-Subspace_${{ steps.version.outputs.APP_VERSION }}_win64"
        path: ./build/JS8Call/

    - name: Upload Installer
      uses: actions/upload-artifact@v5
      with:
        name: "JS8Call-Subspace-Setup_${{ steps.version.outputs.APP_VERSION }}_win64"
        path: ./installer/Output/JS8Call-Subspace-Setup_${{ steps.version.outputs.APP_VERSION }}_win64.exe

    - name: Upload Debug Symbols
      uses: actions/upload-artifact@v5
      with:
        name: "JS8Call-Subspace-Debug_${{ steps.version.outputs.APP_VERSION }}_win64"
        path: ./build/JS8Call-debug.exe
