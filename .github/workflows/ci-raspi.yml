permissions:
  contents: read

name: Raspberry Pi Build (Subspace)

on:
  workflow_dispatch:  # manual trigger only — QEMU build takes ~10 min

jobs:
  build_raspi:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/arm64

    - name: Get version
      id: version
      run: |
        MAJOR=$(grep WSJTX_VERSION_MAJOR Versions.cmake | sed 's/[^0-9]//g')
        MINOR=$(grep WSJTX_VERSION_MINOR Versions.cmake | sed 's/[^0-9]//g')
        PATCH=$(grep WSJTX_VERSION_PATCH Versions.cmake | sed 's/.*PATCH //' | sed 's/)//')
        echo "ver=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

    - name: Build and package in arm64 container
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: none
        base_image: arm64v8/debian:trixie
        githubToken: ${{ github.token }}
        setup: mkdir -p "${PWD}/output"
        dockerRunArgs: --volume "${PWD}/output:/output"
        run: |
          apt-get update
          apt-get install -y build-essential cmake git pkg-config \
            qt6-base-dev qt6-multimedia-dev qt6-serialport-dev \
            libqt6svg6-dev \
            libfftw3-dev libhamlib-dev libboost-all-dev \
            libusb-1.0-0-dev libudev-dev
          mkdir -p /tmp/arm-build && cd /tmp/arm-build
          cmake -DCMAKE_BUILD_TYPE=Release "${GITHUB_WORKSPACE}"
          make -j1
          cd "${GITHUB_WORKSPACE}"
          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/usr/local/bin
          mkdir -p deb-pkg/usr/share/applications
          mkdir -p deb-pkg/usr/share/icons/hicolor/256x256/apps
          cp /tmp/arm-build/JS8Call deb-pkg/usr/local/bin/js8call-subspace
          if [ -f deb-staging/usr/share/applications/js8call-subspace.desktop ]; then
            cp deb-staging/usr/share/applications/js8call-subspace.desktop deb-pkg/usr/share/applications/
          fi
          if [ -f deb-staging/usr/share/icons/hicolor/256x256/apps/js8call-subspace.png ]; then
            cp deb-staging/usr/share/icons/hicolor/256x256/apps/js8call-subspace.png deb-pkg/usr/share/icons/hicolor/256x256/apps/
          fi
          VER=$(grep WSJTX_VERSION_MAJOR Versions.cmake | sed 's/[^0-9]//g').$(grep WSJTX_VERSION_MINOR Versions.cmake | sed 's/[^0-9]//g').$(grep WSJTX_VERSION_PATCH Versions.cmake | sed 's/.*PATCH //' | sed 's/)//')
          printf 'Package: js8call-subspace\nVersion: %s\nArchitecture: arm64\nMaintainer: WM8Q\nDescription: JS8Call Subspace Edition - weak-signal messaging\nDepends: libqt6core6 | libqt6core6t64, libqt6gui6 | libqt6gui6t64, libqt6widgets6 | libqt6widgets6t64, libqt6multimedia6, libqt6serialport6, libfftw3-single3, libhamlib4 | libhamlib4t64, libusb-1.0-0\n' "${VER}" > deb-pkg/DEBIAN/control
          dpkg-deb -Zxz --build deb-pkg "/output/js8call-subspace_${VER}_arm64.deb"
          file deb-pkg/usr/local/bin/js8call-subspace

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: "JS8Call-Subspace-${{ steps.version.outputs.ver }}-arm64-raspi.deb"
        path: output/js8call-subspace_${{ steps.version.outputs.ver }}_arm64.deb
