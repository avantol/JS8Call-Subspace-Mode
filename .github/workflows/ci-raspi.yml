permissions:
  contents: read

name: Raspberry Pi Build (Subspace)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build_raspi:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v5

    - name: Get version
      id: version
      run: |
        MAJOR=$(grep WSJTX_VERSION_MAJOR Versions.cmake | sed 's/[^0-9]//g')
        MINOR=$(grep WSJTX_VERSION_MINOR Versions.cmake | sed 's/[^0-9]//g')
        PATCH=$(grep WSJTX_VERSION_PATCH Versions.cmake | sed 's/.*PATCH //' | sed 's/)//')
        echo "ver=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git pkg-config \
          qt6-base-dev qt6-serialport-dev \
          libqt6svg6-dev \
          libfftw3-dev libhamlib-dev libboost-all-dev \
          libusb-1.0-0-dev libudev-dev

    - name: Build
      run: |
        mkdir -p build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)

    - name: Package .deb
      run: |
        VER=${{ steps.version.outputs.ver }}
        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/bin
        mkdir -p deb-pkg/usr/share/applications
        mkdir -p deb-pkg/usr/share/icons/hicolor/256x256/apps
        # Install to /usr/bin to match the shared js8call-subspace.desktop's
        # Exec=/usr/bin/js8call-subspace (and the amd64 build). Previous
        # /usr/local/bin install left the desktop entry pointing at a
        # path that didn't exist after install on Raspi.
        cp build/JS8Call deb-pkg/usr/bin/js8call-subspace
        if [ -f deb-staging/usr/share/applications/js8call-subspace.desktop ]; then
          cp deb-staging/usr/share/applications/js8call-subspace.desktop deb-pkg/usr/share/applications/
        fi
        if [ -f deb-staging/usr/share/icons/hicolor/256x256/apps/js8call-subspace.png ]; then
          cp deb-staging/usr/share/icons/hicolor/256x256/apps/js8call-subspace.png deb-pkg/usr/share/icons/hicolor/256x256/apps/
        fi
        printf 'Package: js8call-subspace\nVersion: %s\nArchitecture: arm64\nMaintainer: WM8Q\nDescription: Subspace Edition - weak-signal messaging\n Install with: sudo apt install ./Subspace-Edition_%s_arm64-raspi.deb\nDepends: libqt6core6 | libqt6core6t64, libqt6gui6 | libqt6gui6t64, libqt6widgets6 | libqt6widgets6t64, libqt6network6, libqt6serialport6, libfftw3-single3, libhamlib4 | libhamlib4t64, libusb-1.0-0, libudev1\n' "${VER}" "${VER}" > deb-pkg/DEBIAN/control
        dpkg-deb -Zxz --build deb-pkg Subspace-Edition_${VER}_arm64-raspi.deb
        file deb-pkg/usr/bin/js8call-subspace

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: "Subspace-Edition-${{ steps.version.outputs.ver }}-arm64-raspi.deb"
        path: Subspace-Edition_${{ steps.version.outputs.ver }}_arm64-raspi.deb
